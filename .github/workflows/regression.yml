name: Offline Forsta regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test toolkit and mutation detection
        run: node --test regression/test/*.test.mjs
      - name: Check pinned corpus sources
        run: node regression/cli.mjs corpus check
      - name: Exercise agent workflow with temporary XML
        run: node regression/examples/change-and-test.mjs
      - name: Test real survey exports
        run: node regression/cli.mjs test --json regression-output/results.json --junit regression-output/results.xml
      - name: Inventory all exports
        if: always()
        run: |
          node regression/cli.mjs inventory --json regression-output/inventory.json
          python - <<'PYTHON'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = json.loads(Path("regression-output/inventory.json").read_text())
          expected = {path.as_posix() for path in Path("surveys").rglob("*.xml")}
          found = {row["file"] for row in report["files"]}
          assert found == expected, f"Inventory differs from surveys/: {sorted(found ^ expected)}"
          for file in sorted(expected):
              fields = ET.parse(file).findall("./ProjectInfo/SurveyFields/SurveyField")
              family, = [f.get("Value") for f in fields if f.get("Name") == "LinA_flag"]
              versions = [f.get("Value") for f in fields if f.get("Name") == "shell_version"]
              version, = versions or ["0"]
              assert version and version.strip() == version, f"Invalid shell_version in {file}"
              folder = {"Y": "lina_shell", "N": "src_shell"}[family]
              parent = Path("surveys", folder, f"shell-{version}")
              assert Path(file).parent == parent, f"{file} belongs in {parent}"
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forsta-regression-reports
          path: regression-output/
          retention-days: 14
